name: 자동 업데이트 배포

on:
  push:
    branches: [main, cloud-login]
    paths:
      - 'release_payload/**'
      - 'tools/**'
      - 'cloud/**'
      - 'planning/**'
      - '.github/workflows/publish.yml'
      - '.gitattributes'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telecom-release
  # A newer source revision replaces obsolete checks. Publishing remains
  # idempotent and resumes a draft only when both asset digests match.
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python 준비
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 게시 동작 검증
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: 배포할 프로그램 준비
        run: python tools/materialize_release.py
      - name: 임시코어 실제 경로 통합·실제 ID 보존·내역·RN·잠금·실행취소 검증
        run: python tools/check_temporary_merge.py
      - name: 후도면 두 대상 자동접속·3개 중복 오류·OFF 미배정 제외·실행취소 검증
        run: python tools/check_after_autoconnect.py
      - name: 접속 상대 변경·옛 접속 정리·정확한 오류 위치·Windows 함체창 검증
        run: python tools/check_connection_repair.py
      - name: 현장 경로 ID·내역 전체 반영·후도면 삭제 구간·원본 보존 검증
        run: python tools/check_after_identity.py
      - name: 후도면 자동 선번·삭제 전 코어 복원·함체 접속·규칙·전체 취소 검증
        run: python tools/check_auto_allocation.py
      - name: 도면·전체 선번 직접 선택·코어분배·검토 적용·실행취소 검증
        run: python tools/check_manual_allocation.py
      - name: 주 도면 케이블별 저장·빈 번호 필터·144 선번·내역 목록·편집창 복귀 검증
        run: python tools/check_map_allocation.py
      - name: 후도면 실제 접속 완료·절단 철거 표시 분리·RN·미배정 표시 검증
        run: python tools/check_after_assignment.py
      - name: 데스크톱 디자인·작은 화면 배치·상태색·입력 보존 검증
        run: python tools/check_desktop_design.py
      - name: 기존 선번 초기 적용·조사자료 없이 완료 점검·현장 재검사 검증
        run: python tools/check_existing_field_basis.py
      - name: CMD 자동 종료·GUI 유지·중복 방지·업데이트 복구 검증
        run: python tools/check_desktop_launch.py
      - name: 코어ID·내역 교환·접속 보존·실행취소 검증
        run: python tools/check_core_identity_swap.py
      - name: 예외코어 완료 집계·목록 제외·실제 접속 보존 검증
        run: python tools/check_exception_completion.py
      - name: OFF·신호 ON 아닌 끊김 집계 제외·예외 완료·화면 검증
        run: python tools/check_disconnected_completion.py
      - name: 함체 임시코어 배정필요 제외·실제 ID 재계산·화면 검증
        run: python tools/check_temporary_assignment.py
      - name: 실제 접속 구간·겹침 색상·타이머 깜빡임·함체 안내 검증
        run: python tools/check_connection_highlight.py
      - name: OFF 배정 제외·실제 충돌 유지·화면 갱신 검증
        run: python tools/check_off_assignment.py
      - name: 함체 코어 연결도·임시 완료 상태·ID 충돌 케이블 표시 검증
        run: python tools/check_node_diagram.py
      - name: Windows 화면 및 저장 확인
        run: python tools/smoke_windows.py
      - name: Windows 로그인과 도면 동기화 검증
        run: python tools/smoke_cloud_windows.py
      - name: PC·클라우드 저장 결과·시간 초과·재시도·내역 반영 버튼 검증
        run: python tools/check_save_status.py
      - name: 내 도면 복사·원본 보존·독립 동기화·실제 버튼 검증
        run: python tools/check_drawing_copy.py
      - name: 후도면 전체 점검과 선번 재배치 보존 검증
        run: python tools/check_after_plan.py
      - name: 후도면 최소 케이블 경로·OK NOK·직접 지정 및 도면 보존 검증
        run: python tools/check_after_routes.py
      - name: Excel 빈칸 보존과 수정 이력 복원 검증
        run: python tools/check_edit_history.py
      - name: GIS·현장 조사 비교와 도면 보존 검증
        run: python tools/check_field_survey.py
      - name: 현장 선번·케이블별 내역·최종 확정과 배치대기 정리 검증
        run: python tools/check_field_slots.py
      - name: 현장 함체 열기 성능·캐시 갱신·기존 확정 호환 검증
        run: python tools/check_field_performance.py --check
      - name: 현장 실제 코어추적·신호 귀속·자동 OK와 미완료 목록 검증
        run: python tools/check_core_trace.py
      - name: GIS 선택 반영·기존 연결 정리·표시 설정·전체 잠금 토글 검증
        run: python tools/check_field_gis.py
      - name: 함체 같은 ID 한 행·숫자 표기·수정 위치와 실제 연결 보존 검증
        run: python tools/check_node_summary.py
      - name: 자동 잠금과 정보 복사·RN 내부 접속 검증
        run: python tools/check_locks_rn.py
      - name: 현장 Excel 표 추가와 불일치 보존·수동 수정 검증
        run: python tools/check_field_sheet.py
      - name: GIS 선번 유지·신규 임시 자동 OK·수동 수정 검증
        run: python tools/check_field_overlay.py
      - name: 양방향 경로와 중복·통합 ID 찾기 검증
        run: python tools/check_routes_find.py
      - name: 같은 ID 전체 신호·선택 신호·불일치·전후 완료율·화면 갱신 검증
        run: python tools/check_completion.py
      - name: GIS 원본 비교·내역 교체·보존과 함체 수정 화면 검증
        run: python tools/check_field_compare.py
      - name: 표 제목 3단계 정렬과 코어 수정·붙여넣기·경로 보존 검증
        run: python tools/check_table_sort.py
      - name: 배포 파일 만들기
        run: python tools/build_release.py
      - name: Google 로그인 설정과 서버 접근 확인
        run: python tools/check_cloud_server.py
      - name: 검증한 버전 게시
        if: github.ref == 'refs/heads/main'
        run: python tools/publish_release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: '1'
      - name: 실제 자동 업데이트 주소 확인
        if: github.ref == 'refs/heads/main'
        run: python tools/verify_download.py
