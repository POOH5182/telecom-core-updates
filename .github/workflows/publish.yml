name: 자동 업데이트 배포

on:
  push:
    branches: [main, cloud-login]
    paths:
      - 'release_payload/**'
      - 'tools/**'
      - 'cloud/**'
      - 'planning/**'
      - '.github/workflows/publish.yml'
      - '.gitattributes'
      - 'RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telecom-release
  # A newer source revision replaces obsolete checks. Publishing remains
  # idempotent and resumes a draft only when both asset digests match.
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python 준비
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: 게시 동작 검증
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: 배포할 프로그램 준비
        run: python tools/materialize_release.py
      - name: Windows 화면 및 저장 확인
        run: python tools/smoke_windows.py
      - name: Windows 로그인과 도면 동기화 검증
        run: python tools/smoke_cloud_windows.py
      - name: 후도면 전체 점검과 선번 재배치 보존 검증
        run: python tools/check_after_plan.py
      - name: Excel 빈칸 보존과 수정 이력 복원 검증
        run: python tools/check_edit_history.py
      - name: GIS·현장 조사 비교와 도면 보존 검증
        run: python tools/check_field_survey.py
      - name: 배포 파일 만들기
        run: python tools/build_release.py
      - name: Google 로그인 설정과 서버 접근 확인
        run: python tools/check_cloud_server.py
      - name: 검증한 버전 게시
        if: github.ref == 'refs/heads/main'
        run: python tools/publish_release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUTF8: '1'
      - name: 실제 자동 업데이트 주소 확인
        if: github.ref == 'refs/heads/main'
        run: python tools/verify_download.py
